                  var options = {"layout": {"hierarchical": {"enabled": true, "direction": "UD", "sortMethod": "directed", "levelSeparation": 70, "nodeSpacing": 50, "treeSpacing": 150, "blockShifting": true, "edgeMinimization": true, "parentCentralization": true}}, "physics": {"solver": "hierarchicalRepulsion", "hierarchicalRepulsion": {"centralGravity": 0.0, "springLength": 80, "springConstant": 0.02, "nodeDistance": 90, "damping": 0.14}, "stabilization": {"iterations": 150}, "enabled": false}, "nodes": {"widthConstraint": {"maximum": 160}, "heightConstraint": {"minimum": 60}, "font": {"size": 11, "color": "#ffffff", "multi": false, "align": "center"}}, "edges": {"smooth": {"type": "cubicBezier", "forceDirection": "vertical", "roundness": 0.4}, "arrows": {"to": {"enabled": true, "scaleFactor": 0.5}}}, "interaction": {"hover": true}};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
    
    <script>
        // Wait for the network to be initialized
        if (typeof network !== 'undefined' && typeof nodes !== 'undefined' && typeof edges !== 'undefined') {
            // Build parent -> children map from edges DataSet
            const CHILDREN = {};
            edges.get().forEach(e => {
                (CHILDREN[e.from] ||= []).push(e.to);
            });

            function visibleNodeIds() {
                return nodes.get({ filter: n => !n.hidden }).map(n => n.id);
            }

            function debounce(fn, ms=120) {
                let t = null;
                return (...args) => { if (t) clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
            }

            // Compact re-layout pulse: briefly enable physics, stabilize, then fit
            const relayoutCompact = debounce(() => {
                network.setOptions({ physics: { enabled: true } });
                network.stabilize(120);
                const ids = visibleNodeIds();
                if (ids.length) {
                    network.fit({
                        nodes: ids,
                        animation: { duration: 250, easing: "easeInOutQuad" },
                        padding: { top: 30, right: 30, bottom: 30, left: 30 }
                    });
                } else {
                    network.fit({ animation: { duration: 250 } });
                }
                setTimeout(() => network.setOptions({ physics: { enabled: false } }), 10);
            }, 120);

            function toggleChildren(nodeId) {
                const childIds = CHILDREN[nodeId] || [];
                if (!childIds.length) return;

                // Determine new visibility from the first child (toggle as a group)
                const firstChild = nodes.get(childIds[0]);
                const makeHidden = firstChild ? !firstChild.hidden : false;

                const nodeUpdates = [];
                const edgeUpdates = [];

                // Direct children mode: toggle only immediate children
                const nodesToToggle = childIds;
                
                

                childIds.forEach(cid => {
                    const n = nodes.get(cid);
                    if (n) nodeUpdates.push({ id: cid, hidden: makeHidden });
                    
                    // Find all edges leading to this node
                    edges.get().forEach(e => {
                        if (e.to === cid) {
                            edgeUpdates.push({ id: e.id, hidden: makeHidden });
                        }
                    });
                });

                if (nodeUpdates.length) nodes.update(nodeUpdates);
                if (edgeUpdates.length) edges.update(edgeUpdates);
                
                // Re-layout after toggle
                relayoutCompact();
            }

            // Add double-click event handler
            network.on("doubleClick", params => {
                if (params.nodes && params.nodes.length) {
                    toggleChildren(params.nodes[0]);
                }
            });

            // Re-layout on window resize
            window.addEventListener("resize", () => relayoutCompact());
        }
    </script>
